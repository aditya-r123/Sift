<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify listening stats</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="top-bar">
      <a class="btn btn-spotify btn-compact" id="link-spotify-connect" href="/auth/login">Connect Spotify</a>
      <button type="button" class="btn btn-compact" id="btn-logout" hidden>Sign out</button>
    </div>

    <main class="layout">
      <p class="banner error" id="error-banner" hidden></p>

      <section class="card profile-panel" id="profile" hidden></section>

      <div id="stats-panel" class="stats-panel" hidden>
        <section class="grid">
          <article class="card">
            <h2>Top artists</h2>
            <select id="artist-range" aria-label="Top artists timeframe">
              <option value="short_term">Last ~4 weeks</option>
              <option value="medium_term" selected>Last ~6 months</option>
              <option value="long_term">Years</option>
            </select>
            <ol id="top-artists" class="list"></ol>
            <p class="muted empty" id="artists-empty">No artists yet.</p>
          </article>
          <article class="card">
            <h2>Top tracks</h2>
            <p class="muted small mb-08">Tap a track for RapidAPI extended features (needs <code>RAPIDAPI_KEY</code>).</p>
            <select id="track-range" aria-label="Top tracks timeframe">
              <option value="short_term">Last ~4 weeks</option>
              <option value="medium_term" selected>Last ~6 months</option>
              <option value="long_term">Years</option>
            </select>
            <ul id="top-tracks" class="list flat list-tracks"></ul>
            <p class="muted empty" id="tracks-empty">No tracks yet.</p>
          </article>
          <article class="card span-2">
            <h2>Recently played</h2>
            <ul id="recent" class="list flat list-tracks"></ul>
            <p class="muted empty" id="recent-empty">No recent plays yet.</p>
          </article>
        </section>
      </div>
    </main>

    <dialog id="track-insights" class="insights-modal">
      <form method="dialog" class="insights-form">
        <div class="insights-head">
          <h2 id="insights-title">Track details</h2>
          <button type="submit" class="btn" value="" aria-label="Close">✕</button>
        </div>
        <p class="muted small" id="insights-subtitle" hidden></p>
        <div id="insights-body" class="insights-body">
          <p class="muted">Loading…</p>
        </div>
        <p class="muted small" id="insights-foot" hidden></p>
      </form>
    </dialog>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
